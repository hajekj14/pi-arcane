# pi-arcane upload sidecar — FRONT VM (TLS terminator, tunnwl), install as
#   /etc/nginx/sites-enabled/pump.hajek.click
# then: sudo nginx -t && sudo systemctl reload nginx
#
# Why this file exists
# --------------------
# pump.hajek.click is otherwise served by the catch-all in
# /etc/nginx/sites-enabled/wildcard.hajek.click, which sets no
# client_max_body_size and therefore inherits nginx's 1 MB default — the 413
# that caps every upload over ~1 MB. Raising the limit in the wildcard block
# would raise it for arcane.hajek.click and every other subdomain too.
#
# nginx matches an exact server_name before a wildcard one, so this block takes
# over pump.hajek.click and nothing else changes. It is a copy of the wildcard
# block with four differences, each marked below.

server {
    # No `default_server` here — that flag already belongs to the wildcard
    # block, and repeating it on the same listen address is a config error.
    listen 443 ssl;
    server_name pump.hajek.click;

    # Same wildcard certificate; it already covers pump.hajek.click.
    ssl_certificate /etc/letsencrypt/live/hajek.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hajek.click/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # (1) The actual fix. Matches -max_upload_size (268435456) in the
    # container's config; use 0 to disable nginx's check and let the app
    # enforce the limit on its own.
    client_max_body_size 256m;

    # (2) Stream the body through instead of spooling the whole upload to disk
    # on this VM before the docker host sees a single byte.
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8099;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        # (3) The upload server has no websockets. Forcing Connection:
        # "upgrade" as the wildcard block does would prevent connection reuse,
        # which matters when pushing hundreds of files one request each.
        proxy_set_header Connection "";

        # (4) Match the app's 300s read/write timeouts so a large upload is not
        # cut short mid-transfer.
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
