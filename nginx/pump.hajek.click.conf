# pi-arcane upload sidecar — install on the Docker host (starena) as
#   /etc/nginx/sites-enabled/pump.hajek.click
# then: sudo nginx -t && sudo systemctl reload nginx
#
# Fronts the `pi-arcane-upload` container (mayth/simple-upload-server:v2),
# published on 127.0.0.1:5559. Same shape as the arcane.hajek.click vhost:
# listen on 8099, the front VM terminates TLS for *.hajek.click and forwards
# here.
#
#   https://pump.hajek.click/files/<slug>/ctx/<path>?overwrite=true
#       Authorization: Bearer $PI_UPLOAD_TOKEN
#       Content-Type: multipart/form-data   (field name: "file")
#
# ---------------------------------------------------------------------------
# ALSO REQUIRED on the front VM
# ---------------------------------------------------------------------------
# The TLS terminator sees the request first and applies its own body limit.
# Add `client_max_body_size 256m;` to its pump.hajek.click (or *.hajek.click)
# server block too — otherwise it returns 413 before this config is ever
# consulted. That is exactly what capped the earlier tests at ~1 MB.

# A keepalive pool to the upload server. Uploads are one request per file, so
# reusing connections instead of a fresh TCP handshake each time is the single
# biggest win when pushing a few hundred files.
upstream pi_upload {
    server 127.0.0.1:5559;
    keepalive 32;
}

server {
    listen 8099;
    server_name pump.hajek.click;

    # Match -max_upload_size in the container (268435456 = 256 MiB).
    # Use 0 to disable the check entirely and let the app enforce the limit.
    client_max_body_size 256m;

    location / {
        proxy_pass http://pi_upload;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1 with an empty Connection header keeps the upstream pool
        # above alive. Note this differs from the arcane vhost, which sets
        # Connection "upgrade" for websockets — the upload server has none,
        # and forcing "upgrade" would defeat keepalive.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Stream the body straight through instead of spooling the whole
        # upload to a temp file first. Without this, nginx buffers every
        # upload to disk before the app sees a single byte.
        proxy_request_buffering off;

        # The app is configured with -read_timeout/-write_timeout 300s;
        # keep nginx from cutting a large upload short before that.
        client_body_timeout 300s;
        proxy_send_timeout  300s;
        proxy_read_timeout  300s;

        # Fail fast when the container is down, instead of hanging the client.
        proxy_connect_timeout 5s;
    }
}
