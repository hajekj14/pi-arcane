# pi-arcane routing — install on the Docker host (starena) as
#   /etc/nginx/sites-enabled/pi-arcane.hajek.click
# then: sudo nginx -t && sudo systemctl reload nginx
#
# Apply this ONCE. Every future deployment works with no further nginx change.
#
# How it fits the existing setup
# ------------------------------
# The front VM already terminates TLS for *.hajek.click on 443 and forwards to
# 127.0.0.1:8099 on this host. This vhost listens on 8099 like the others
# (e.g. arcane.hajek.click), so nothing else needs touching.
#
# Why the hostname encodes a port
# -------------------------------
# The obvious design — pi-<appname>.hajek.click proxying to a container by name
# — cannot work here. Host nginx has no way to resolve Docker container names:
# each deployment lands on its own compose network and Docker's embedded DNS is
# not reachable from the host, so `resolver 172.17.0.1` never answers and the
# request 502s after a 30s DNS timeout. (That is exactly what the older
# dynamic-tests `t-*` vhost does.)
#
# Encoding the published host port in the hostname avoids DNS entirely and uses
# the same 127.0.0.1:<port> upstream the working vhosts already use.
#
#   https://pi-5553.hajek.click  ->  http://127.0.0.1:5553
#
# The extension publishes each deployment on a free host port starting at 5553
# and reports the matching URL, so the two always agree.

server {
    listen 8099;
    server_name ~^pi-(?<pi_port>\d+)\.hajek\.click$;

    # Refuse anything outside the range the extension allocates from (5550-5599),
    # so a crafted hostname cannot be used to reach arbitrary local services —
    # e.g. pi-3552 would otherwise proxy straight to Arcane itself, and a
    # database bound to localhost would be one hostname away.
    # If you configure a custom port_mapping outside this range, widen it here.
    location / {
        if ($pi_port !~ ^55[5-9][0-9]$) {
            return 404;
        }

        proxy_pass http://127.0.0.1:$pi_port;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Fail fast when nothing is listening, instead of hanging the client.
        proxy_connect_timeout 5s;
    }
}
